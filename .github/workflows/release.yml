name: Publish Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version variables
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          RAW_VERSION="${TAG_NAME#v}"

          if [[ "$RAW_VERSION" == *"+"* ]]; then
            GAME_VERSION="${RAW_VERSION##*+}"
            MOD_VERSION="${RAW_VERSION%%+*}"
          else
            GAME_VERSION=$(grep 'minecraft_version' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
            MOD_VERSION="$RAW_VERSION"
          fi

          MODRINTH_VERSION="${MOD_VERSION}+${GAME_VERSION}fabric"
          VERSION_TYPE=release
          RELEASE_NAME="Show My Item v${MOD_VERSION}"

          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV
          echo "UNPREFIXED_TAG=v${MOD_VERSION}" >> $GITHUB_ENV
          echo "MODRINTH_VERSION=$MODRINTH_VERSION" >> $GITHUB_ENV
          echo "VERSION_TYPE=$VERSION_TYPE" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "GAME_VERSIONS=$GAME_VERSION" >> $GITHUB_ENV

      - name: Check for existing GitHub Release
        run: |
          EXISTING_RELEASE=$(gh release list --json tagName,name | jq -r ".[] | select(.name == \"${{ env.RELEASE_NAME }}\") | .tagName")
          if [ -n "$EXISTING_RELEASE" ]; then
            echo "Release ${{ env.RELEASE_NAME }} already exists on tag $EXISTING_RELEASE"
            echo "EXISTING_RELEASE=$EXISTING_RELEASE" >> $GITHUB_ENV
          else
            echo "No existing release found for ${{ env.RELEASE_NAME }}"
            echo "EXISTING_RELEASE=" >> $GITHUB_ENV
          fi

      - name: Generate changelog from commits
        run: |
          CURRENT_TAG=${GITHUB_REF_NAME}
          PREV_TAG=$(git tag --sort=-v:refname | grep -v '\-alpha' | grep -v '\-beta' | grep '^v[0-9]' | awk -v tag="$CURRENT_TAG" '$0 == tag {getline; print; exit}')
          if [ "$PREV_TAG" = "$CURRENT_TAG" ] || [ -z "$PREV_TAG" ]; then
            PREV_TAG=""
          fi
          if [ -n "$PREV_TAG" ]; then
            COMMIT_RANGE="$PREV_TAG..$CURRENT_TAG"
          else
            COMMIT_RANGE="HEAD"
          fi
          python3 << 'PYEOF'
          import subprocess, re
          from collections import defaultdict

          commit_range = "$COMMIT_RANGE"
          output = subprocess.check_output(['git', 'log', '--pretty=format:%s|%an', commit_range]).decode().strip()
          commits = [line.split('|', 1) for line in output.split('\n')] if output else []

          categories = {
              'feat': ('✨ 新功能', []),
              'fix': ('🐛 Bug 修复', []),
              'perf': ('⚡ 性能优化', []),
              'refactor': ('♻️ 重构', []),
              'docs': ('📝 文档', []),
              'build': ('🔨 构建', []),
              'ci': ('🤖 CI/CD', []),
              'test': ('🧪 测试', []),
              'chore': ('🧹 杂项', []),
          }

          for commit_msg, author in commits:
              matched = False
              for prefix, (label, lst) in categories.items():
                  if commit_msg.lower().startswith(prefix + ':') or commit_msg.lower().startswith(prefix + '('):
                      lst.append(f'- {commit_msg}')
                      matched = True
                      break
              if not matched:
                  categories['chore'][1].append(f'- {commit_msg}')

          lines = []
          for label, commits in categories.items():
              if commits:
                  lines.append(f"\n### {label}\n")
                  lines.extend(commits)
          changelog = '\n'.join(lines)
          with open('changelog.md', 'w', encoding='utf-8') as f:
              f.write(changelog)
          print(changelog)
          PYEOF

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew clean build

      - name: Find and prepare JAR
        run: |
          FINAL_JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*.module.jar' | sort | head -n 1)
          if [ -z "$FINAL_JAR" ]; then
            echo "No final JAR found" >&2
            exit 1
          fi
          NEW_NAME="showmyitem-${MODRINTH_VERSION}.jar"
          cp "$FINAL_JAR" "build/libs/$NEW_NAME"
          echo "RELEASE_JAR=build/libs/$NEW_NAME" >> $GITHUB_ENV

      - name: Create or update GitHub Release
        run: |
          if [ -n "$EXISTING_RELEASE" ]; then
            gh release edit "$EXISTING_RELEASE" \
              --title "${{ env.RELEASE_NAME }}" \
              --notes-file changelog.md
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ env.RELEASE_NAME }}" \
              --notes-file changelog.md \
              --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Modrinth
        run: |
          EXISTING_MODRINTH=$(curl -s "https://api.modrinth.com/v1/project/pMKJZtiq/version/${{ env.MODRINTH_VERSION }}" | jq -r '.id // empty')
          if [ -n "$EXISTING_MODRINTH" ]; then
            echo "Modrinth version ${{ env.MODRINTH_VERSION }} already exists"
            echo "EXISTING_MODRINTH=$EXISTING_MODRINTH" >> $GITHUB_ENV
          else
            echo "No existing Modrinth version found"
            echo "EXISTING_MODRINTH=" >> $GITHUB_ENV
          fi

          if [ -z "$EXISTING_MODRINTH" ]; then
            CHANGELOG=$(cat changelog.md | sed 's/"/\\"/g' | tr '\n' '\a' | sed 's/\a/\\n/g')
            curl -s -X POST "https://api.modrinth.com/v1/project/pMKJZtiq/version" \
              -H "Authorization: ${{ secrets.MODRINTH_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"${{ env.RELEASE_NAME }}\",
                \"version_number\": \"${{ env.MODRINTH_VERSION }}\",
                \"version_type\": \"${{ env.VERSION_TYPE }}\",
                \"changelog\": \"$CHANGELOG\",
                \"game_versions\": [\"${{ env.GAME_VERSIONS }}\"],
                \"loaders\": [\"fabric\"],
                \"files\": [{
                  \"path\": \"${{ env.RELEASE_JAR }}\",
                  \"primary\": true
                }]
              }"
          else
            echo "Skipping Modrinth upload - version already exists"
          fi
